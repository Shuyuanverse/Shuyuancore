[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shuyuancore"
version = "1.3.0"
description = "ShuyuanCore - 智能进化、风格一致、深度记忆、自主行动的开源AI Agent"
requires-python = ">=3.10"
authors = [{name = "山野 (Shuyuanverse)", email = "fenghuazongjuelun@qq.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20",
    "structlog>=24.0",
    "colorlog>=6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "prompt-toolkit>=3.0.0",
    "tiktoken>=0.5.0",
]

# AI 相关依赖（需额外安装：pip install shuyuancore[ai]）
[project.optional-dependencies]
ai = [
    "dashscope>=1.14.0",
    "jieba>=0.42.1",
    "snownlp>=0.12.3",
    "numpy>=1.24.0",
]
tools = ["docker>=7.0"]
playwright = ["playwright>=1.40"]
office = ["openpyxl>=3.1", "python-docx>=1.0", "reportlab>=4.0"]
ocr = ["pytesseract>=0.3"]
chart = ["matplotlib>=3.7", "plotly>=5.15"]
crypto = ["cryptography>=41.0"]
media = ["Pillow>=10.0"]
vector = ["chromadb>=0.4.22"]
torch = ["torch>=2.0"]
transformers = ["transformers>=4.30"]
all = [
    "shuyuancore[ai]",
    "shuyuancore[tools]",
    "shuyuancore[playwright]",
    "shuyuancore[office]",
    "shuyuancore[ocr]",
    "shuyuancore[chart]",
    "shuyuancore[crypto]",
    "shuyuancore[media]",
    "shuyuancore[vector]",
    "shuyuancore[torch]",
    "shuyuancore[transformers]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "alembic>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
