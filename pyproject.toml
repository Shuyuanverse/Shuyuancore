[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shuyuancore"
version = "1.0.0"
description = "ShuyuanCore - 智能进化、风格一致、深度记忆、自主行动的开源AI Agent"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20",
    "numpy>=1.24.0",
    "dashscope>=1.14.0",
    "structlog>=24.0",
    "colorlog>=6.0",
    "jieba>=0.42.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
tools = ["docker>=7.0"]
playwright = ["playwright>=1.40"]
office = ["openpyxl>=3.1", "python-docx>=1.0", "reportlab>=4.0"]
ocr = ["pytesseract>=0.3"]
chart = ["matplotlib>=3.7", "plotly>=5.15"]
crypto = ["cryptography>=41.0"]
media = ["Pillow>=10.0"]
all = [
    "shuyuancore[tools]",
    "shuyuancore[playwright]",
    "shuyuancore[office]",
    "shuyuancore[ocr]",
    "shuyuancore[chart]",
    "shuyuancore[crypto]",
    "shuyuancore[media]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "alembic>=1.13",
    "jieba>=0.42",
    "snownlp>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]