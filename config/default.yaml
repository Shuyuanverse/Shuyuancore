agent:
  name: ShuyuanCore
  mode: general

models:
  default: dashscope/qwen-max
  embedding: dashscope/text-embedding-v2
  embedding_dimensions: 1536
  routing:
    code: deepseek/deepseek-chat
    chat: dashscope/qwen-max
    math: dashscope/qwen-max
    embedding: dashscope/text-embedding-v2
    tool: dashscope/qwen-turbo
    review: deepseek/deepseek-chat
  providers:
    dashscope:
      api_key: ${DASHSCOPE_API_KEY}
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-max
      embedding_model: text-embedding-v2
    deepseek:
      api_key: ${DEEPSEEK_API_KEY}
      base_url: https://api.deepseek.com/v1
      model: deepseek-chat
    openai:
      api_key: ${OPENAI_API_KEY}
      base_url: https://api.openai.com/v1
    ollama:
      base_url: http://localhost:11434

memory:
  core_memory_limit: 2200
  user_model_limit: 1375
  consolidation_threshold: 0.8
  fts5_search_limit: 10
  vector_search_limit: 5
  working:
    expire_days: 30
    auto_cleanup: true
  chroma:
    persist_directory: data/chroma
    client_type: persistent
    collections:
      long_term_memory:
        metadata: [source, timestamp, topic, importance]
      conversations:
        metadata: [session_id, user_id, role, timestamp]
  embedding:
    provider: dashscope
    dedup_threshold: 0.95
    batch_size: 20

skills:
  auto_extract: true
  progressive_disclosure: true
  curator_interval_days: 7
  curator_max_iterations: 3
  stale_days: 30
  archive_days: 90
  difficulty_driven: true

persona:
  drift_threshold: 0.25
  review_drift_threshold: 0.15
  enable_proactive: false
  style_dimensions: 256
  anchor_dimensions_pytorch: 256
  anchor_dimensions_numpy: 256
  bound_components: true
  min_input_chars: 100
  max_input_chars: 1000000
  language_samples_min: 500
  language_samples_max: 1000
  style_7_dimensions:
    - formality
    - warmth
    - directness
    - playfulness
    - detail_orientation
    - emotional_expression
    - pace
  protection_levels:
    normal: 0.15
    mild_drift: 0.25
    severe_drift: 3
  identity_file: CORE.md
  identity:
    max_identities: 5
    switch_methods:
      - natural_language
      - slash_command
    shared_layers: [L3, L4]
    independent_layers: [L1, L6]

evolution:
  trigger_days: 7
  trigger_count: 40
  max_active_modules: 5
  fuse_threshold: 3
  archive_inactive_days: 14

prediction:
  enable_proactive: true
  feedback_loop: true

security:
  require_approval: true
  sandbox: docker
  audit_log: true
  ip_whitelist: []
  env_expose: false
  data_encryption: true
  network_isolation: true
  privacy_desensitize: true
  session_isolation: true
  operation_rollback: true
  rate_limit: true
  sensitive_confirm: true
  output_filter: true
  permission_grading: true

gateway:
  platforms:
    cli:
      enabled: true
    api:
      enabled: true
      port: 8000
    telegram:
      enabled: false
      token: ${TELEGRAM_BOT_TOKEN}
    wechat:
      enabled: false
    wechat_work:
      enabled: false
    feishu:
      enabled: false
    dingtalk:
      enabled: false
    qq:
      enabled: false
  history:
    per_page: 50
    max_per_page: 200
    cache_recent: 20

cron:
  enabled: true
  check_interval: 60
  condition_trigger: true
  task_chain: true

deploy:
  host: 0.0.0.0
  port: 8005
  workers: 1
  log_level: info
  log_rotation:
    max_size: 50MB
    backup_count: 5
  health_check:
    enabled: true
    endpoint: /health
    interval: 30
  methods:
    - curl_bash
    - pip
    - homebrew
    - docker
    - source
    - cloud_one_click