name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        env:
          DASHSCOPE_API_KEY: ci-placeholder-key
          DEEPSEEK_API_KEY: ci-placeholder-key
          OPENAI_API_KEY: ci-placeholder-key

      - name: Run tests
        run: |
          pytest -v --tb=short --timeout=120
        env:
          DASHSCOPE_API_KEY: ci-placeholder-key
          DEEPSEEK_API_KEY: ci-placeholder-key
          OPENAI_API_KEY: ci-placeholder-key

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: |
          ruff check src/

      - name: ruff format check
        run: |
          ruff format --check src/

  type-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: mypy type check
        run: |
          mypy src/ --ignore-missing-imports

  import-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: Verify imports
        run: |
          python -c "import src; print('src OK')"
          python -c "from src.config import get_settings; print('config OK')"
          python -c "from src.core.agent import Agent; print('core OK')"
          python -c "from src.memory.store import MemoryStore; print('memory OK')"
          python -c "from src.gateway.api_server import create_app; print('gateway OK')"
